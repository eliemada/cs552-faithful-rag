name: Sync to Classroom Repo

# Thin trigger wrapper around _sync-classroom.yml. The actual sync logic
# lives in the reusable workflow so tag-milestone.yml can reuse it.

on:
  schedule:
    # Every night at 02:00 UTC.
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  sync:
    uses: ./.github/workflows/_sync-classroom.yml
    secrets:
      CLASSROOM_PAT: ${{ secrets.CLASSROOM_PAT }}
